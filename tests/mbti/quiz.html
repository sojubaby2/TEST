<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MBTI 테스트 진행중... | 알아볼괘</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 12</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/mbti-data.js"></script>
<script>
  let current = 0;
  const tally = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

  const qNum = document.getElementById("qNum");
  const qText = document.getElementById("qText");
  const optionsEl = document.getElementById("options");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");

  function renderQuestion() {
    const q = MBTI_QUESTIONS[current];
    qNum.textContent = "Q" + (current + 1);
    qText.textContent = q.text;
    optionsEl.innerHTML = "";

    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = opt.text;
      btn.addEventListener("click", () => selectOption(opt.letter));
      optionsEl.appendChild(btn);
    });

    const pct = Math.round((current / MBTI_QUESTIONS.length) * 100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = current + " / " + MBTI_QUESTIONS.length;
  }

  function selectOption(letter) {
    tally[letter] = (tally[letter] || 0) + 1;
    current += 1;

    if (current >= MBTI_QUESTIONS.length) {
      progressBar.style.width = "100%";
      progressLabel.textContent = MBTI_QUESTIONS.length + " / " + MBTI_QUESTIONS.length;
      finishQuiz();
      return;
    }
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function finishQuiz() {
    const r = tallyToMbtiAxis(tally);
    const url = "result-" + r.code + ".html?overall=" + r.overall +
      "&ei=" + r.ei + "&sn=" + r.sn + "&tf=" + r.tf + "&jp=" + r.jp;
    setTimeout(() => {
      window.location.href = url;
    }, 350);
  }

  renderQuestion();
</script>

</body>
</html>
