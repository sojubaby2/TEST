<script src="../../assets/js/vendor/manseryeok.min.js"></script>
<script src="../../assets/js/saju-data.js"></script>
<script src="../../assets/js/saju-engine.js"></script>
<script src="../../assets/js/saju-reading.js"></script>
<script src="../../assets/js/saju-topics.js"></script>
<script src="../../assets/js/saju-render.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var y = parseInt(params.get("y"), 10);
    var m = parseInt(params.get("m"), 10);
    var d = parseInt(params.get("d"), 10);
    var hStr = params.get("h");
    var miStr = params.get("mi");
    var hasTime = hStr !== null && hStr !== "";
    var h = hasTime ? parseInt(hStr, 10) : undefined;
    var mi = hasTime ? (miStr !== null ? parseInt(miStr, 10) : 0) : undefined;
    var gParam = params.get("g");
    var gender = (gParam === "male" || gParam === "female") ? gParam : null;

    var errorBox = document.getElementById("errorBox");
    var errorText = document.getElementById("errorText");
    var resultBox = document.getElementById("resultBox");

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    if (!y || !m || !d) {
      showError("입력 정보를 찾을 수 없어요. 다시 입력해주세요.");
      return;
    }

    var raw, saju, analysis, reading;
    try {
      raw = Manseryeok.calculateSaju(y, m, d, h, mi);
      // 만세력이 내장한 절기 표는 해마다 같은 값이라 절입 시각이 어긋납니다.
      // 년주·월주는 태양 황경으로 다시 계산해 덮어씌웁니다. (일주·시주는 그대로)
      saju = SajuEngine.correctPillars(raw, y, m, d, h, mi);
      analysis = SajuEngine.analyze(saju, {
        y: y, m: m, d: d, h: h, mi: mi, gender: gender
      });
      reading = SajuReading.build(analysis, { y: y, m: m, d: d, hasTime: hasTime });
    } catch (e) {
      showError("사주를 계산할 수 없어요. (1900~2050년생만 계산 가능해요) 생년월일을 다시 확인해주세요.");
      return;
    }

    resultBox.style.display = "block";

    var dayStemChar = analysis.dayStem;
    var legacy = getDaystemResult(dayStemChar);
    var ds = reading.dayStem;

    document.getElementById("resultHero").style.background = legacy.color;
    document.getElementById("resultEmoji").textContent = ds.emoji;
    document.getElementById("resultTitle").textContent = ds.title;
    document.getElementById("resultSubtitle").textContent =
      ds.nick + " · " + analysis.strength.level +
      (analysis.gyeokguk ? " · " + analysis.gyeokguk.name : "");

    SajuRender.renderAll(analysis, reading, document.getElementById("report"), {
      corrected: saju._corrected,
      dayStem: dayStemChar,
      birth: { y: y, m: m, d: d, h: h, mi: mi, gender: gender }
    });

    // 출생 정보 라벨 (그리드 카드 안에 렌더러가 비워둔 자리)
    var birthLabel = y + "년 " + m + "월 " + d + "일";
    if (hasTime) {
      birthLabel += " " + h + "시 " + mi + "분 출생";
      if (saju.isTimeCorrected && saju.correctedTime) {
        birthLabel += " · 진태양시 " + saju.correctedTime.hour + "시 " + saju.correctedTime.minute + "분 보정";
      }
    } else {
      birthLabel += " 출생 (시간 미입력 — 시주 제외)";
    }
    if (gender) birthLabel += " · " + (gender === "male" ? "남성" : "여성");
    birthLabel += " · 사주 연도 " + saju.sajuYear + "년";
    var labelEl = document.getElementById("birthInfoLabel");
    if (labelEl) labelEl.textContent = birthLabel;

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        "나의 사주는 '" + ds.title + "' " + ds.emoji,
        "십신·오행·대운까지 풀어주는 사주풀이. 알아볼괘에서 확인해봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyLinkToClipboard();
    });
    document.getElementById("downloadBtn").addEventListener("click", function () {
      downloadImage(
        "../../assets/img/card/saju-" + dayStemChar + ".png",
        "알아볼괘_사주_" + ds.title + ".png"
      );
    });
  })();
</script>
