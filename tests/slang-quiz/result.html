<!doctype html>
<html lang="ko">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1329092235174593"
     crossorigin="anonymous"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의 신조어 지식퀴즈 결과는? | 알아볼괘</title>
<meta name="description" content="신조어 지식퀴즈 결과" />
<meta name="robots" content="noindex" />

<meta property="og:type" content="website" />
<meta property="og:title" content="나의 신조어 지식퀴즈 결과는?" />
<meta property="og:description" content="요즘 신조어 얼마나 알아? 너도 알아볼괘에서 확인해봐!" />
<meta property="og:image" content="../../assets/img/og/slang-quiz-intro.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div id="errorBox" style="display:none;">
    <div class="card">
      <p style="margin:0;font-size:14px;">결과를 찾을 수 없어요. 퀴즈를 다시 풀어주세요.</p>
    </div>
    <a class="btn btn-primary" href="index.html" style="margin-top:16px;">다시 풀기</a>
  </div>

  <div id="resultBox" style="display:none;">
    <div class="result-hero" id="resultHero">
      <div class="emoji" id="resultEmoji"></div>
      <h1 id="resultTitle"></h1>
      <p class="subtitle" id="resultSubtitle"></p>
    </div>

    <div class="card index-card">
      <p class="index-title">신조어 점수</p>
      <p class="index-percent" id="indexPercent">-</p>
      <div class="index-gauge-outer">
        <div class="index-gauge-inner" id="indexGauge" style="width:0%;"></div>
      </div>
      <p class="index-sub" id="indexSub"></p>
    </div>

    <div class="card">
      <p style="margin:0;font-size:15px;" id="gradeDesc"></p>
    </div>

    <div class="btn-row" style="margin-top:24px;">
      <button class="btn btn-primary" id="shareBtn" type="button">결과 공유하기</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="copyBtn" type="button">🔗 링크 복사</button>
    </div>

    <a class="btn btn-secondary" href="index.html" style="margin-top:20px;">🔄 다시 풀어보기</a>
    <a class="btn btn-secondary" href="../../index.html">🏠 다른 테스트 보러가기</a>

    <div class="ad-slot">광고 영역 (심사 통과 후 게재 예정)</div>
  </div>

  <p class="notice">
    ⚠️ 이 퀴즈는 재미로 즐기는 콘텐츠예요.
  </p>

  <div class="footer">
    <p><a href="../../privacy.html">개인정보처리방침</a> · <a href="../../terms.html">이용약관</a></p>
  </div>
</main>

<script src="../../assets/js/slang-quiz-data.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var scoreParam = params.get("score");
    var score = scoreParam !== null && !isNaN(Number(scoreParam)) ? Number(scoreParam) : null;

    var errorBox = document.getElementById("errorBox");
    var resultBox = document.getElementById("resultBox");

    if (score === null) {
      errorBox.style.display = "block";
      return;
    }

    var tier = getSlangTier(score);
    resultBox.style.display = "block";

    document.getElementById("resultHero").style.background = tier.color;
    document.getElementById("resultEmoji").textContent = tier.emoji;
    document.getElementById("resultTitle").textContent = tier.title;
    document.getElementById("resultSubtitle").textContent = tier.subtitle;

    var indexPercent = document.getElementById("indexPercent");
    var indexGauge = document.getElementById("indexGauge");
    var percent = Math.round((score / SLANG_QUESTIONS.length) * 100);
    indexPercent.textContent = score + " / " + SLANG_QUESTIONS.length;
    indexPercent.style.color = tier.color;
    indexGauge.style.background = tier.color;
    requestAnimationFrame(function () {
      indexGauge.style.width = percent + "%";
    });
    document.getElementById("indexSub").textContent = "정답률 " + percent + "% · " + tier.title + " 등급이에요";

    document.getElementById("gradeDesc").textContent = tier.desc;

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        "신조어 지식퀴즈 결과: '" + tier.title + "' " + tier.emoji + " (" + score + "/" + SLANG_QUESTIONS.length + "점)",
        "요즘 신조어 얼마나 알아? 너도 알아볼괘에서 확인해봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyLinkToClipboard();
    });
  })();
</script>

</body>
</html>
