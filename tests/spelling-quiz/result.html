<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var scoreParam = params.get("score");
    var score = scoreParam !== null && scoreParam !== "" && !isNaN(Number(scoreParam)) ? Number(scoreParam) : null;
    var total = SPELL_TOTAL;
    var errorBox = document.getElementById("errorBox");
    var resultBox = document.getElementById("resultBox");
    if (score === null) { errorBox.style.display = "block"; return; }
    score = Math.max(0, Math.min(total, Math.round(score)));

    // 틀린 문제 번호 (주소의 w=3.17.40). 숫자가 아니거나 범위를 벗어난 값은 버립니다.
    var wrong = [];
    (params.get("w") || "").split(".").forEach(function (v) {
      var n = Number(v);
      if (v !== "" && Number.isInteger(n) && n >= 0 && n < SPELL_QUESTIONS.length && wrong.indexOf(n) === -1) wrong.push(n);
    });
    wrong = wrong.slice(0, total);

    var tier = getSpellTier(score);
    resultBox.style.display = "block";
    document.getElementById("resultHero").style.setProperty("--rc", tier.color);
    document.getElementById("resultEmoji").textContent = tier.emoji;
    document.getElementById("resultTitle").textContent = tier.title;
    document.getElementById("resultSubtitle").textContent = tier.subtitle;

    var percent = Math.round((score / total) * 100);
    var indexPercent = document.getElementById("indexPercent");
    var indexGauge = document.getElementById("indexGauge");
    indexPercent.textContent = score + " / " + total;
    indexPercent.style.color = tier.color;
    indexGauge.style.background = tier.color;
    requestAnimationFrame(function () { indexGauge.style.width = percent + "%"; });
    document.getElementById("indexSub").textContent = "정답률 " + percent + "% · 찍어도 평균 6개쯤은 맞는 시험이에요";
    document.getElementById("gradeDesc").textContent = tier.desc;

    // 틀린 문제 다시 보기. 다 맞혔거나 번호가 없으면 어려운 문항 3개를 보여 줍니다.
    var list = document.getElementById("reviewList");
    var show = wrong, isWrongList = wrong.length > 0;
    if (!isWrongList) {
      var hard = [];
      SPELL_QUESTIONS.forEach(function (q, i) { if (q.diff === 3) hard.push(i); });
      show = spellShuffle(hard).slice(0, 3);
    }
    document.getElementById("reviewTitle").textContent = isWrongList ? "틀린 문제 다시 보기" : "이것도 알아 두면 좋아요";
    document.getElementById("reviewNote").textContent = isWrongList
      ? "노란 칸이 바른 표기예요. 이유를 한 번 읽어 두면 다음엔 안 틀려요."
      : "많은 사람이 헷갈리는 표기 세 가지를 골랐어요.";
    show.forEach(function (i) {
      var q = SPELL_QUESTIONS[i];
      var li = document.createElement("li");
      var sent = document.createElement("p"); sent.className = "sp-sent"; sent.innerHTML = fillSpell(q.q, q.correct, true);
      var x = document.createElement("p"); x.className = "sp-x";
      var s = document.createElement("s"); s.textContent = q.wrong;
      x.appendChild(document.createTextNode("틀린 표기: ")); x.appendChild(s);
      var y = document.createElement("p"); y.className = "sp-y"; y.textContent = q.why;
      li.appendChild(sent); li.appendChild(x); li.appendChild(y);
      list.appendChild(li);
    });

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        "맞춤법 능력고사 결과: '" + tier.title + "' " + tier.emoji + " (" + score + "/" + total + "점)",
        "며칠? 몇일? 너도 12문제로 맞춤법 실력을 확인해 봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () { copyLinkToClipboard(); });
  })();
</script>
