<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의 사주팔자 | 마음캐치 정통 사주풀이</title>
<meta name="description" content="절기 기준 만세력으로 계산한 나의 사주팔자와 일간 성격 풀이" />
<meta name="robots" content="noindex" />

<meta property="og:type" content="website" />
<meta property="og:title" content="나의 사주팔자" />
<meta property="og:description" content="절기 기준 만세력으로 계산한 진짜 내 사주, 너도 확인해봐!" />
<meta property="og:image" content="../../assets/img/og/saju-result.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☯️</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html">🧠 마음캐치</a>
</header>

<main class="wrap">
  <div id="errorBox" style="display:none;">
    <div class="card">
      <p style="margin:0;font-size:14px;" id="errorText"></p>
    </div>
    <a class="btn btn-primary" href="index.html" style="margin-top:16px;">다시 입력하기</a>
  </div>

  <div id="resultBox" style="display:none;">
    <div class="result-hero" id="resultHero">
      <div class="emoji" id="resultEmoji"></div>
      <h1 id="resultTitle"></h1>
      <p class="subtitle" id="resultSubtitle"></p>
    </div>

    <p class="section-title" style="margin-top:24px;">나의 사주팔자</p>
    <div class="card">
      <div class="pillar-grid" id="pillarGrid"></div>
      <p id="birthInfoLabel" style="margin:14px 0 0;font-size:12px;color:var(--text-sub);text-align:center;"></p>
    </div>

    <p class="section-title" style="margin-top:24px;">오행 분석</p>
    <div class="card">
      <div class="element-bars" id="elementBars"></div>
    </div>

    <p class="section-title" style="margin-top:24px;">일간(日干) 성격 풀이</p>
    <div class="card">
      <p style="margin:0;font-size:15px;" id="daystemSummary"></p>
      <ul class="trait-list" id="daystemTraits"></ul>
    </div>

    <p class="section-title" style="margin-top:28px;">일간 기준 궁합</p>
    <div id="compatSection"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="shareBtn" type="button">결과 공유하기</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="copyBtn" type="button">🔗 링크 복사</button>
      <button class="btn btn-secondary" id="downloadBtn" type="button">🖼️ 이미지 저장</button>
    </div>

    <a class="btn btn-secondary" href="index.html" style="margin-top:20px;">🔄 다시 계산하기</a>
    <a class="btn btn-secondary" href="../../index.html">🏠 다른 테스트 보러가기</a>

    <div class="ad-slot">광고 영역 (심사 통과 후 게재 예정)</div>
  </div>

  <p class="notice">
    ⚠️ 사주팔자 계산은 24절기 기준 만세력 알고리즘으로 정확하게 계산하지만, 해석 내용은 재미로 즐기는 콘텐츠예요. 중요한 의사결정의 근거로 사용하지 마세요.
  </p>

  <div class="footer">
    <p><a href="../../privacy.html">개인정보처리방침</a> · <a href="../../terms.html">이용약관</a></p>
  </div>
</main>

<script src="../../assets/js/vendor/manseryeok.min.js"></script>
<script src="../../assets/js/saju-data.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var y = parseInt(params.get("y"), 10);
    var m = parseInt(params.get("m"), 10);
    var d = parseInt(params.get("d"), 10);
    var hStr = params.get("h");
    var miStr = params.get("mi");
    var hasTime = hStr !== null && hStr !== "";
    var h = hasTime ? parseInt(hStr, 10) : undefined;
    var mi = hasTime ? (miStr !== null ? parseInt(miStr, 10) : 0) : undefined;

    var errorBox = document.getElementById("errorBox");
    var errorText = document.getElementById("errorText");
    var resultBox = document.getElementById("resultBox");

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    if (!y || !m || !d) {
      showError("입력 정보를 찾을 수 없어요. 다시 입력해주세요.");
      return;
    }

    var saju;
    try {
      saju = Manseryeok.calculateSaju(y, m, d, h, mi);
    } catch (e) {
      showError("사주를 계산할 수 없어요. (1900~2050년생만 계산 가능해요) 생년월일을 다시 확인해주세요.");
      return;
    }

    resultBox.style.display = "block";

    var dayStemChar = saju.dayPillar.charAt(0);
    var daystem = getDaystemResult(dayStemChar);

    document.getElementById("resultHero").style.background = daystem.color;
    document.getElementById("resultEmoji").textContent = daystem.emoji;
    document.getElementById("resultTitle").textContent = daystem.title;
    document.getElementById("resultSubtitle").textContent = daystem.subtitle;

    // 사주팔자 4주(또는 3주) 그리드
    var pillarGrid = document.getElementById("pillarGrid");
    var pillars = [
      { label: "년주", hanja: saju.yearPillarHanja, hangul: saju.yearPillar },
      { label: "월주", hanja: saju.monthPillarHanja, hangul: saju.monthPillar },
      { label: "일주", hanja: saju.dayPillarHanja, hangul: saju.dayPillar },
    ];
    if (saju.hourPillar) {
      pillars.push({ label: "시주", hanja: saju.hourPillarHanja, hangul: saju.hourPillar });
    } else {
      pillarGrid.classList.add("cols-3");
    }
    pillars.forEach(function (p) {
      var cell = document.createElement("div");
      cell.className = "pillar-cell";
      cell.innerHTML =
        '<p class="pillar-label">' + p.label + "</p>" +
        '<p class="pillar-hanja">' + p.hanja + "</p>" +
        '<p class="pillar-hangul">' + p.hangul + "</p>";
      pillarGrid.appendChild(cell);
    });

    var birthLabel = y + "년 " + m + "월 " + d + "일";
    if (hasTime) {
      birthLabel += " " + h + "시 " + mi + "분 출생";
      if (saju.isTimeCorrected && saju.correctedTime) {
        birthLabel += " (진태양시 보정: " + saju.correctedTime.hour + "시 " + saju.correctedTime.minute + "분)";
      }
    } else {
      birthLabel += " 출생 (시간 미입력 - 시주 제외)";
    }
    document.getElementById("birthInfoLabel").textContent = birthLabel;

    // 오행 분석
    var counts = countElements(saju);
    var maxCount = Math.max.apply(null, Object.values(counts));
    var elementBars = document.getElementById("elementBars");
    ["목", "화", "토", "금", "수"].forEach(function (el) {
      var meta = ELEMENT_META[el];
      var count = counts[el];
      var pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
      var row = document.createElement("div");
      row.className = "element-row";
      row.innerHTML =
        '<span class="element-emoji">' + meta.emoji + "</span>" +
        '<span class="element-name">' + meta.label + "</span>" +
        '<span class="element-bar-outer"><span class="element-bar-inner" style="width:' + pct + "%;background:" + meta.color + ';"></span></span>' +
        '<span class="element-count">' + count + "</span>";
      elementBars.appendChild(row);
    });

    // 일간 성격 풀이
    document.getElementById("daystemSummary").textContent = daystem.summary;
    var traitsEl = document.getElementById("daystemTraits");
    daystem.traits.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      traitsEl.appendChild(li);
    });

    // 궁합 - 일간 궁합은 별도 결과 페이지가 없는 단일 페이지 구조라
    // 공용 renderCompatSection(링크 카드) 대신 정보 카드 형태로 직접 렌더링함
    (function renderDaystemCompat() {
      var container = document.getElementById("compatSection");
      function findById(id) { return DAYSTEM_RESULTS.find(function (r) { return r.id === id; }); }
      function cardHtml(kind, label, matchInfo) {
        var target = findById(matchInfo.id);
        return (
          '<div class="compat-card compat-' + kind + '">' +
          '<div class="compat-label">' + label + "</div>" +
          '<div class="compat-type"><span class="compat-emoji">' + target.emoji + '</span><span>' + target.title + "</span></div>" +
          '<p class="compat-reason">' + matchInfo.reason + "</p>" +
          "</div>"
        );
      }
      container.innerHTML =
        cardHtml("best", "💘 잘 맞는 일간", daystem.compat.best) +
        cardHtml("worst", "⚡ 상극인 일간", daystem.compat.worst);
    })();

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        "나의 사주는 '" + daystem.title + "' " + daystem.emoji,
        "내 진짜 사주는? 마음캐치에서 확인해봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyLinkToClipboard();
    });
    document.getElementById("downloadBtn").addEventListener("click", function () {
      downloadImage(
        "../../assets/img/card/saju-" + dayStemChar + ".png",
        "마음캐치_사주_" + daystem.title + ".png"
      );
    });
  })();
</script>

</body>
</html>
