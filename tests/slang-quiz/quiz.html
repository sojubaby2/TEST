<!doctype html>
<html lang="ko">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1329092235174593"
     crossorigin="anonymous"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>신조어 지식퀴즈 진행중... | 알아볼괘</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 10</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/slang-quiz-data.js"></script>
<script>
  var order = shuffleArraySlang(SLANG_QUESTIONS);
  var current = 0;
  var correctCount = 0;
  var locked = false;

  var qNum = document.getElementById("qNum");
  var qText = document.getElementById("qText");
  var optionsEl = document.getElementById("options");
  var progressBar = document.getElementById("progressBar");
  var progressLabel = document.getElementById("progressLabel");

  function renderQuestion() {
    locked = false;
    var q = order[current];
    qNum.textContent = "Q" + (current + 1);
    qText.textContent = "'" + q.term + "'의 뜻은?";
    optionsEl.innerHTML = "";

    var choices = shuffleArraySlang(q.wrong.concat([q.correct]));

    choices.forEach(function (choice) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = choice;
      btn.addEventListener("click", function () {
        selectOption(btn, choice, q.correct);
      });
      optionsEl.appendChild(btn);
    });

    var pct = Math.round((current / order.length) * 100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = current + " / " + order.length;
  }

  function selectOption(btn, choice, correctAnswer) {
    if (locked) return;
    locked = true;

    var isCorrect = choice === correctAnswer;
    if (isCorrect) {
      correctCount += 1;
      btn.classList.add("correct");
    } else {
      btn.classList.add("wrong");
      Array.prototype.forEach.call(optionsEl.querySelectorAll(".option-btn"), function (b) {
        if (b.textContent === correctAnswer) b.classList.add("correct");
      });
    }
    Array.prototype.forEach.call(optionsEl.querySelectorAll(".option-btn"), function (b) {
      b.disabled = true;
    });

    setTimeout(function () {
      current += 1;
      if (current >= order.length) {
        progressBar.style.width = "100%";
        progressLabel.textContent = order.length + " / " + order.length;
        finishQuiz();
        return;
      }
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 700);
  }

  function finishQuiz() {
    var url = "result.html?score=" + encodeURIComponent(correctCount);
    setTimeout(function () {
      window.location.href = url;
    }, 350);
  }

  renderQuestion();
</script>

</body>
</html>
