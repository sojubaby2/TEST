<body class="qp">

<header class="site-header">
  <a class="logo" href="../../"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 10</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/bread-type-data.js"></script>
<script>
  let current = 0;
  const tally = { sikppang: 0, croissant: 0, saltbread: 0, danpat: 0, baguette: 0 };

  const qNum = document.getElementById("qNum");
  const qText = document.getElementById("qText");
  const optionsEl = document.getElementById("options");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");

  function renderQuestion() {
    const q = BREADTYPE_QUESTIONS[current];
    qNum.textContent = "Q" + (current + 1);
    qText.textContent = q.text;
    optionsEl.innerHTML = "";

    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = opt.text;
      btn.addEventListener("click", () => selectOption(opt.key));
      optionsEl.appendChild(btn);
    });

    const pct = Math.round((current / BREADTYPE_QUESTIONS.length) * 100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = current + " / " + BREADTYPE_QUESTIONS.length;
  }

  function selectOption(key) {
    tally[key] = (tally[key] || 0) + 1;
    current += 1;

    if (current >= BREADTYPE_QUESTIONS.length) {
      progressBar.style.width = "100%";
      progressLabel.textContent = BREADTYPE_QUESTIONS.length + " / " + BREADTYPE_QUESTIONS.length;
      finishQuiz();
      return;
    }
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function finishQuiz() {
    const result = tallyToBreadTypeResult(tally);
    const percent = Math.round(((tally[result.id] || 0) / BREADTYPE_APPEARANCES) * 100);
    const url = "result-" + result.id + ".html?percent=" + Math.min(percent, 100);
    setTimeout(() => {
      window.location.href = url;
    }, window.QP_DELAY || 350);
  }

  renderQuestion();
</script>

<script src="../../assets/js/quiz-plus.js"></script>
</body>
