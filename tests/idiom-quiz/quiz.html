<style>
  .sp-why { margin: 14px 0 0; padding: 14px 16px; border-radius: 14px; background: #FFF4D1; border: 2px solid #1B1F3B; font-size: 14.5px; line-height: 1.7; color: #1B1F3B; word-break: keep-all; }
  .sp-why b { display: block; margin-bottom: 4px; font-size: 15px; }
  .sp-why .sp-sent { display: block; margin-bottom: 6px; font-weight: 700; }
  .sp-why .sp-sent b { display: inline; margin: 0; font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .sp-why.is-wrong { background: #FBE3DE; }
  .sp-next { margin-top: 14px; }
  .question-text .sp-blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid currentColor; text-align: center; }
</style>

<body class="qp">

<header class="site-header">
  <a class="logo" href="../../"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 12</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
    <div id="whyBox" aria-live="polite"></div>
  </div>
</main>

<script src="../../assets/js/idiom-quiz-data.js"></script>
<script>
  // 48문항 중 난이도를 맞춰 12개를 뽑습니다 (매번 문제가 달라져요)
  var order = pickSpellQuestions();
  var current = 0;
  var correctCount = 0;
  var wrongIdx = [];
  var locked = false;

  var qNum = document.getElementById("qNum");
  var qText = document.getElementById("qText");
  var optionsEl = document.getElementById("options");
  var whyBox = document.getElementById("whyBox");
  var progressBar = document.getElementById("progressBar");
  var progressLabel = document.getElementById("progressLabel");

  function renderQuestion() {
    locked = false;
    var q = order[current];
    qNum.textContent = "Q" + (current + 1);
    qText.innerHTML = q.q.split("□").join('<span class="sp-blank">&nbsp;</span>');
    optionsEl.innerHTML = "";
    whyBox.innerHTML = "";

    spellShuffle([q.correct, q.wrong]).forEach(function (choice) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = choice;
      btn.addEventListener("click", function () { selectOption(btn, choice, q); });
      optionsEl.appendChild(btn);
    });

    progressBar.style.width = Math.round((current / order.length) * 100) + "%";
    progressLabel.textContent = current + " / " + order.length;
  }

  function selectOption(btn, choice, q) {
    if (locked) return;
    locked = true;
    var isCorrect = choice === q.correct;
    if (isCorrect) {
      correctCount += 1;
      btn.classList.add("correct");
    } else {
      wrongIdx.push(q.idx);
      btn.classList.add("wrong");
    }
    Array.prototype.forEach.call(optionsEl.querySelectorAll(".option-btn"), function (b) {
      if (b.textContent === q.correct) b.classList.add("correct");
      b.disabled = true;
    });

    var why = document.createElement("div");
    why.className = "sp-why" + (isCorrect ? "" : " is-wrong");
    var head = document.createElement("b");
    head.textContent = isCorrect ? "정답이에요!" : "아쉬워요, 정답은 '" + q.correct + "'";
    why.appendChild(head);
    var sent = document.createElement("span");
    sent.className = "sp-sent";
    sent.innerHTML = fillSpell(q.q, q.correct, true);
    why.appendChild(sent);
    why.appendChild(document.createTextNode(q.why));
    whyBox.appendChild(why);

    var last = current + 1 >= order.length;
    var next = document.createElement("button");
    next.type = "button";
    next.className = "btn btn-primary sp-next";
    next.textContent = last ? "결과 보기" : "다음 문제";
    next.addEventListener("click", function () {
      current += 1;
      if (current >= order.length) {
        next.disabled = true;
        progressBar.style.width = "100%";
        progressLabel.textContent = order.length + " / " + order.length;
        finishQuiz();
        return;
      }
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    whyBox.appendChild(next);
    try { next.focus({ preventScroll: true }); } catch (e) {}
  }

  function finishQuiz() {
    var url = "result.html?score=" + encodeURIComponent(correctCount) + (wrongIdx.length ? "&w=" + wrongIdx.join(".") : "");
    setTimeout(function () { window.location.href = url; }, window.QP_DELAY || 350);
  }

  renderQuestion();
</script>

<script src="../../assets/js/quiz-plus.js"></script>
</body>
</html>
