<!doctype html>
<html lang="ko">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1329092235174593"
     crossorigin="anonymous"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>인생을 게임으로 치면 내 포지션은? 진행중... | 알아볼괘</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 10</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/game-position-data.js"></script>
<script>
  let current = 0;
  const tally = { tank: 0, dealer: 0, healer: 0, support: 0, assassin: 0 };

  const qNum = document.getElementById("qNum");
  const qText = document.getElementById("qText");
  const optionsEl = document.getElementById("options");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");

  function renderQuestion() {
    const q = GAMEPOSITION_QUESTIONS[current];
    qNum.textContent = "Q" + (current + 1);
    qText.textContent = q.text;
    optionsEl.innerHTML = "";

    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = opt.text;
      btn.addEventListener("click", () => selectOption(opt.key));
      optionsEl.appendChild(btn);
    });

    const pct = Math.round((current / GAMEPOSITION_QUESTIONS.length) * 100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = current + " / " + GAMEPOSITION_QUESTIONS.length;
  }

  function selectOption(key) {
    tally[key] = (tally[key] || 0) + 1;
    current += 1;

    if (current >= GAMEPOSITION_QUESTIONS.length) {
      progressBar.style.width = "100%";
      progressLabel.textContent = GAMEPOSITION_QUESTIONS.length + " / " + GAMEPOSITION_QUESTIONS.length;
      finishQuiz();
      return;
    }
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function finishQuiz() {
    const result = tallyToGamePositionResult(tally);
    const percent = Math.round(((tally[result.id] || 0) / GAMEPOSITION_APPEARANCES) * 100);
    const url = "result-" + result.id + ".html?percent=" + Math.min(percent, 100);
    setTimeout(() => {
      window.location.href = url;
    }, 350);
  }

  renderQuestion();
</script>

</body>
</html>
