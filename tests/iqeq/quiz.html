<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IQ/EQ 테스트 진행중... | 테스트맛집</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html">🔥 테스트맛집</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 12</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1 · 논리</div>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/iqeq-data.js"></script>
<script>
  let current = 0;
  let iqScore = 0;
  let eqScore = 0;

  const qNum = document.getElementById("qNum");
  const qText = document.getElementById("qText");
  const optionsEl = document.getElementById("options");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");

  function renderQuestion() {
    const q = IQEQ_QUESTIONS[current];
    qNum.textContent = "Q" + (current + 1) + " · " + (q.type === "iq" ? "논리" : "감성");
    qText.textContent = q.text;
    optionsEl.innerHTML = "";

    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = opt.text;
      btn.addEventListener("click", () => selectOption(q.type, opt.score));
      optionsEl.appendChild(btn);
    });

    const pct = Math.round((current / IQEQ_QUESTIONS.length) * 100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = current + " / " + IQEQ_QUESTIONS.length;
  }

  function selectOption(type, score) {
    if (type === "iq") {
      iqScore += score;
    } else {
      eqScore += score;
    }
    current += 1;

    if (current >= IQEQ_QUESTIONS.length) {
      progressBar.style.width = "100%";
      progressLabel.textContent = IQEQ_QUESTIONS.length + " / " + IQEQ_QUESTIONS.length;
      finishQuiz();
      return;
    }
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function finishQuiz() {
    const result = getIqEqResult(iqScore, eqScore);
    const url =
      "result-" + result.id + ".html?iq=" + iqScore + "&eq=" + eqScore;
    setTimeout(() => {
      window.location.href = url;
    }, 350);
  }

  renderQuestion();
</script>

</body>
</html>
