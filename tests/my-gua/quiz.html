<style>
.qp .mg-gua { display: inline-flex; flex-direction: column; gap: 6px; width: 74px; }
.qp .mg-gua i { display: block; height: 12px; border-radius: 4px; background: var(--ink); }
.qp .mg-gua i.n { background: linear-gradient(90deg, var(--ink) 0 42%, transparent 42% 58%, var(--ink) 58% 100%); }
.qp .mg-hero-gua { display: flex; justify-content: center; gap: 10px; margin: 2px 0 16px; }
.qp .mg-hero-gua .mg-gua { width: 46px; gap: 5px; }
.qp .mg-hero-gua .mg-gua i { height: 8px; }
.qp .mg-hero-gua .mg-gua:nth-child(odd) i { background-color: var(--jeok); }
.qp .mg-hero-gua .mg-gua:nth-child(odd) i.n { background: linear-gradient(90deg, var(--jeok) 0 42%, transparent 42% 58%, var(--jeok) 58% 100%); }
.qp .mg-scene { display: inline-block; margin: 0 0 10px; padding: 4px 10px; border-radius: 8px; background: var(--hwang-soft); font-size: 13px; font-weight: 800; }
/* 결과: 괘 이름표 */
.qp .result-hero .mg-tag { position: relative; display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 800; }
.qp .result-hero .mg-tag b { font-size: 18px; color: var(--hwang); font-weight: 800; }
.qp .result-hero .mg-big { position: relative; display: flex; justify-content: center; margin: 4px 0 14px; }
.qp .result-hero .mg-big .mg-gua { width: 96px; gap: 8px; padding: 16px 18px; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; transform: rotate(-3deg); }
.qp .result-hero .mg-big .mg-gua i { height: 14px; }
/* 세 막대 풀이 */
.qp .mg-lines { display: grid; gap: 10px; margin: 6px 0 0; padding: 0; list-style: none; }
.qp .mg-lines li { text-align: left; display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; background: var(--mist); }
.qp .mg-lines .mg-gua { width: 54px; gap: 0; }
.qp .mg-lines .mg-gua i { height: 10px; }
.qp .mg-lines small { display: block; font-size: 12px; font-weight: 700; color: var(--sub); }
.qp .mg-lines strong { font-size: 15.5px; font-weight: 800; }
/* 한마디 */
.qp .mg-line { margin: 16px 0 0; padding: 18px 20px; border-radius: 18px; background: var(--ink); color: var(--paper); font-family: var(--hand); font-size: 26px; font-weight: 700; line-height: 1.3; text-align: center; word-break: keep-all; }
.qp .mg-line::before { content: "이 괘 사람의 입버릇"; display: block; margin-bottom: 6px; font-family: "Pretendard Variable", Pretendard, sans-serif; font-size: 12px; font-weight: 700; color: var(--hwang); }
/* 팔괘 지도 */
.qp .mg-map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.qp .mg-map a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px; border: 2px solid var(--line); border-radius: 14px; font-size: 13px; font-weight: 800; color: var(--ink); text-align: center; }
.qp .mg-map a .mg-gua { width: 34px; gap: 3px; }
.qp .mg-map a .mg-gua i { height: 6px; border-radius: 2px; }
.qp .mg-map a small { font-size: 11px; font-weight: 700; color: var(--sub); }
.qp .mg-map a:hover { border-color: var(--ink); }
.qp .mg-map a[aria-current] { background: var(--hwang); border-color: var(--ink); }

<body class="qp">

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 12</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="mg-scene" id="qScene"></p>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/my-gua-data.js"></script>
<script>
  (function () {
    var current = 0;
    var answers = [];
    var name = "";
    try { name = (localStorage.getItem("arabol:name") || "").trim(); } catch (e) {}

    var qNum = document.getElementById("qNum");
    var qScene = document.getElementById("qScene");
    var qText = document.getElementById("qText");
    var optionsEl = document.getElementById("options");
    var progressBar = document.getElementById("progressBar");
    var progressLabel = document.getElementById("progressLabel");
    var total = MYGUA_QUESTIONS.length;

    function fill(t) {
      return t.replace("{이름}, ", name ? name + "님, " : "").replace("{이름}", name ? name + "님" : "");
    }

    function render() {
      var q = MYGUA_QUESTIONS[current];
      qNum.textContent = "Q" + (current + 1);
      qScene.textContent = q.scene;
      qText.textContent = fill(q.text);
      optionsEl.innerHTML = "";
      q.options.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.type = "button";
        btn.textContent = opt.text;
        btn.addEventListener("click", function () { pick(opt); });
        optionsEl.appendChild(btn);
      });
      progressBar.style.width = Math.round(current / total * 100) + "%";
      progressLabel.textContent = current + " / " + total;
    }

    function pick(opt) {
      answers.push({ axis: opt.axis, yang: opt.yang });
      current += 1;
      if (current >= total) {
        progressBar.style.width = "100%";
        progressLabel.textContent = total + " / " + total;
        var r = getMyGuaByCode(myGuaCode(answers));
        var url = "result-" + r.id + ".html";
        setTimeout(function () { window.location.href = url; }, window.QP_DELAY || 350);
        return;
      }
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    render();
  })();
</script>

<script src="../../assets/js/quiz-plus.js"></script>
</body>
</html>
