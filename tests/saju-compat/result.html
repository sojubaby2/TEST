<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>우리 둘의 사주 궁합은? | 마음캐치 사주명리학 궁합</title>
<meta name="description" content="절기 기준 만세력으로 계산한 두 사람의 사주팔자와 일간 오행 상생상극 궁합 결과" />
<meta name="robots" content="noindex" />

<meta property="og:type" content="website" />
<meta property="og:title" content="우리 둘의 사주 궁합은?" />
<meta property="og:description" content="절기 기준 만세력으로 계산한 진짜 사주 궁합, 너도 확인해봐!" />
<meta property="og:image" content="../../assets/img/og/saju-compat-result.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☯️</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html">🧠 마음캐치</a>
</header>

<main class="wrap">
  <div id="errorBox" style="display:none;">
    <div class="card">
      <p style="margin:0;font-size:14px;" id="errorText"></p>
    </div>
    <a class="btn btn-primary" href="index.html" style="margin-top:16px;">다시 입력하기</a>
  </div>

  <div id="resultBox" style="display:none;">
    <div class="result-hero" id="resultHero">
      <div class="emoji" id="resultEmoji"></div>
      <h1 id="resultTitle"></h1>
      <p class="subtitle" id="resultSubtitle"></p>
    </div>

    <div class="card index-card">
      <p class="index-title">사주 궁합 점수</p>
      <p class="index-percent" id="indexPercent">-</p>
      <div class="index-gauge-outer">
        <div class="index-gauge-inner" id="indexGauge" style="width:0%;"></div>
      </div>
      <p class="index-sub" id="relationLabel"></p>
    </div>

    <div class="card">
      <p style="margin:0;font-size:15px;line-height:1.6;" id="compatDesc"></p>
      <div class="tarot-tip-box" style="margin-top:14px;">
        <span class="icon">💡</span>
        <div>
          <b>이렇게 해보세요</b>
          <span id="compatTip"></span>
        </div>
      </div>
      <p id="complementNote" style="margin:14px 0 0;font-size:13px;color:var(--text-sub);display:none;"></p>
    </div>

    <p class="section-title" style="margin-top:24px;">두 사람의 사주팔자</p>
    <div class="card">
      <p class="compat-person-title" id="personALabel"></p>
      <div class="pillar-grid" id="pillarGridA"></div>
      <p style="margin:10px 0 0;font-size:12px;color:var(--text-sub);" id="daystemSummaryA"></p>
    </div>
    <div class="card">
      <p class="compat-person-title" id="personBLabel"></p>
      <div class="pillar-grid" id="pillarGridB"></div>
      <p style="margin:10px 0 0;font-size:12px;color:var(--text-sub);" id="daystemSummaryB"></p>
    </div>

    <p class="section-title" style="margin-top:24px;">오행 밸런스 비교</p>
    <div class="card">
      <p class="compat-person-title" id="elementsALabel"></p>
      <div class="element-bars" id="elementBarsA"></div>
      <div style="height:16px;"></div>
      <p class="compat-person-title" id="elementsBLabel"></p>
      <div class="element-bars" id="elementBarsB"></div>
    </div>

    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-primary" id="shareBtn" type="button">결과 공유하기</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="copyBtn" type="button">🔗 링크 복사</button>
      <button class="btn btn-secondary" id="downloadBtn" type="button">🖼️ 이미지 저장</button>
    </div>

    <a class="btn btn-secondary" href="index.html" style="margin-top:20px;">🔄 다시 보기</a>
    <a class="btn btn-secondary" href="../../index.html">🏠 다른 테스트 보러가기</a>

    <div class="ad-slot">광고 영역 (심사 통과 후 게재 예정)</div>
  </div>

  <p class="notice">
    ⚠️ 사주팔자 계산은 24절기 기준 만세력 알고리즘으로 정확하게 계산하지만, 해석 내용은 재미로 즐기는 콘텐츠예요. 중요한 의사결정의 근거로 사용하지 마세요.
  </p>

  <div class="footer">
    <p><a href="../../privacy.html">개인정보처리방침</a> · <a href="../../terms.html">이용약관</a></p>
  </div>
</main>

<script src="../../assets/js/vendor/manseryeok.min.js"></script>
<script src="../../assets/js/saju-data.js"></script>
<script src="../../assets/js/saju-compat-data.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);

    function readPerson(suffix) {
      var name = params.get("name" + suffix);
      var y = parseInt(params.get("y" + suffix), 10);
      var m = parseInt(params.get("m" + suffix), 10);
      var d = parseInt(params.get("d" + suffix), 10);
      var hStr = params.get("h" + suffix);
      var miStr = params.get("mi" + suffix);
      var hasTime = hStr !== null && hStr !== "";
      return {
        name: name,
        y: y, m: m, d: d,
        h: hasTime ? parseInt(hStr, 10) : undefined,
        mi: hasTime ? (miStr !== null ? parseInt(miStr, 10) : 0) : undefined,
        hasTime: hasTime,
      };
    }

    var personA = readPerson("A");
    var personB = readPerson("B");

    var errorBox = document.getElementById("errorBox");
    var errorText = document.getElementById("errorText");
    var resultBox = document.getElementById("resultBox");

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    if (!personA.name || !personA.y || !personA.m || !personA.d || !personB.name || !personB.y || !personB.m || !personB.d) {
      showError("입력 정보를 찾을 수 없어요. 다시 입력해주세요.");
      return;
    }

    var sajuA, sajuB;
    try {
      sajuA = Manseryeok.calculateSaju(personA.y, personA.m, personA.d, personA.h, personA.mi);
      sajuB = Manseryeok.calculateSaju(personB.y, personB.m, personB.d, personB.h, personB.mi);
    } catch (e) {
      showError("사주를 계산할 수 없어요. (1900~2050년생만 계산 가능해요) 생년월일을 다시 확인해주세요.");
      return;
    }

    resultBox.style.display = "block";

    var result = getSajuCompatResult(sajuA, sajuB, personA.name, personB.name);
    var meta = result.meta;

    document.getElementById("resultHero").style.background = meta.color;
    document.getElementById("resultEmoji").textContent = meta.emoji;
    document.getElementById("resultTitle").textContent = personA.name + " ❤ " + personB.name;
    document.getElementById("resultSubtitle").textContent = meta.title;

    var indexPercent = document.getElementById("indexPercent");
    var indexGauge = document.getElementById("indexGauge");
    indexPercent.textContent = result.score + "%";
    indexPercent.style.color = meta.color;
    indexGauge.style.background = meta.color;
    requestAnimationFrame(function () {
      indexGauge.style.width = result.score + "%";
    });
    document.getElementById("relationLabel").textContent = result.relationLabel;

    document.getElementById("compatDesc").textContent = result.desc;
    document.getElementById("compatTip").textContent = result.tip;

    if (result.complementNote) {
      var noteEl = document.getElementById("complementNote");
      noteEl.textContent = "🌿 " + result.complementNote;
      noteEl.style.display = "block";
    }

    function renderPillars(saju, gridId) {
      var grid = document.getElementById(gridId);
      var pillars = [
        { label: "년주", hanja: saju.yearPillarHanja, hangul: saju.yearPillar },
        { label: "월주", hanja: saju.monthPillarHanja, hangul: saju.monthPillar },
        { label: "일주", hanja: saju.dayPillarHanja, hangul: saju.dayPillar },
      ];
      if (saju.hourPillar) {
        pillars.push({ label: "시주", hanja: saju.hourPillarHanja, hangul: saju.hourPillar });
      } else {
        grid.classList.add("cols-3");
      }
      pillars.forEach(function (p) {
        var cell = document.createElement("div");
        cell.className = "pillar-cell";
        cell.innerHTML =
          '<p class="pillar-label">' + p.label + "</p>" +
          '<p class="pillar-hanja">' + p.hanja + "</p>" +
          '<p class="pillar-hangul">' + p.hangul + "</p>";
        grid.appendChild(cell);
      });
    }

    renderPillars(sajuA, "pillarGridA");
    renderPillars(sajuB, "pillarGridB");

    document.getElementById("personALabel").textContent =
      "🙋 " + personA.name + " · " + result.daystemA.emoji + " " + result.daystemA.title;
    document.getElementById("personBLabel").textContent =
      "🙋 " + personB.name + " · " + result.daystemB.emoji + " " + result.daystemB.title;
    document.getElementById("daystemSummaryA").textContent = result.daystemA.summary;
    document.getElementById("daystemSummaryB").textContent = result.daystemB.summary;

    function renderElementBars(counts, barsId) {
      var el = document.getElementById(barsId);
      var maxCount = Math.max.apply(null, Object.values(counts));
      ["목", "화", "토", "금", "수"].forEach(function (elKey) {
        var m = ELEMENT_META[elKey];
        var count = counts[elKey];
        var pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
        var row = document.createElement("div");
        row.className = "element-row";
        row.innerHTML =
          '<span class="element-emoji">' + m.emoji + "</span>" +
          '<span class="element-name">' + m.label + "</span>" +
          '<span class="element-bar-outer"><span class="element-bar-inner" style="width:' + pct + "%;background:" + m.color + ';"></span></span>' +
          '<span class="element-count">' + count + "</span>";
        el.appendChild(row);
      });
    }

    document.getElementById("elementsALabel").textContent = "🙋 " + personA.name;
    document.getElementById("elementsBLabel").textContent = "🙋 " + personB.name;
    renderElementBars(result.countsA, "elementBarsA");
    renderElementBars(result.countsB, "elementBarsB");

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        personA.name + " ❤ " + personB.name + " 사주 궁합은 " + result.score + "% (" + meta.title + ") " + meta.emoji,
        "진짜 사주로 계산한 우리 궁합, 너도 마음캐치에서 확인해봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyLinkToClipboard();
    });
    document.getElementById("downloadBtn").addEventListener("click", function () {
      downloadImage(
        "../../assets/img/card/saju-compat-" + meta.id + ".png",
        "마음캐치_사주궁합_" + meta.title + ".png"
      );
    });
  })();
</script>

</body>
</html>
