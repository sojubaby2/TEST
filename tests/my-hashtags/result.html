    var tagsEl = document.getElementById("htTags"), parts = document.getElementById("htParts");

    document.getElementById("htLine").textContent = line;

    // 결과 카드 그림: 이 기기 안에서 바로 그려서 저장 (어디로도 보내지 않음)
    document.getElementById("downloadBtn").addEventListener("click", function () {
      var W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
      var g = c.getContext("2d");
      g.fillStyle = "#FFC93C"; g.fillRect(0, 0, W, H);

        var y = 330 + i * 230, text = "#" + t.tag;

        var w = Math.min(g.measureText(text).width + 120, W - 120), x = (W - w) / 2;
        g.save(); g.translate(W / 2, y); g.rotate([-0.05, 0.035, -0.02][i]); g.translate(-W / 2, -y);
        g.fillStyle = "#1B1F3B"; roundRect(g, x + 10, y - 80, w, 160, 80); g.fill();
        g.fillStyle = colors[i]; roundRect(g, x, y - 90, w, 160, 80); g.fill();
        g.lineWidth = 8; g.strokeStyle = "#1B1F3B"; g.stroke();
        g.fillStyle = "#1B1F3B"; g.textBaseline = "middle"; g.fillText(text, W / 2, y - 6);
        g.restore();
      });
      g.font = "700 40px 'Pretendard Variable', Pretendard, sans-serif"; g.textBaseline = "alphabetic";

      g.font = "800 34px 'Pretendard Variable', Pretendard, sans-serif"; g.fillText("arabol.co.kr", W / 2, H - 70);
      c.toBlob(function (b) {

        a.download = "알아볼괘_해시태그.png"; document.body.appendChild(a); a.click(); a.remove();
      }, "image/png");
    });
    function roundRect(g, x, y, w, h, r) {
      g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function wrap(g, text, x, y, maxW, lh) {
      var words = text.split(" "), line = "", lines = [];
      words.forEach(function (w) { var t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
      lines.push(line);
      lines.forEach(function (l, i) { g.fillText(l, x, y + i * lh); });
    }
  })();
