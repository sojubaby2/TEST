<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta property="og:type" content="website" />
<meta property="og:title" content="A형 성격 궁합 🅰️" />
<meta property="og:description" content="A형의 성격, 장단점, 연애 스타일, 궁합까지 한번에!" />
<meta property="og:image" content="../../assets/img/og/blood-type-intro.png" />
<meta property="og:url" content="./result-a.html" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🅰️</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="result-hero" style="background:#3B82F6;">
    <div class="emoji">🅰️</div>
    <h1>A형</h1>
    <p class="subtitle" id="oneLinerLabel"></p>
  </div>

  <div class="card">
    <p class="section-title" style="margin-top:0;">A형는(은) 이런 사람이에요</p>
    <p style="margin:0;font-size:14px;line-height:1.8;color:var(--text-main);" id="descriptionLabel"></p>
  </div>

  <p class="section-title" style="margin-top:24px;">강점 & 조심할 점</p>
  <div class="card">
    <p style="margin:0 0 8px;font-size:13px;font-weight:700;color:#15803d;">👍 강점</p>
    <div class="trait-tag-list" id="strengthsList" style="margin-bottom:16px;"></div>
    <p style="margin:0 0 8px;font-size:13px;font-weight:700;color:#b45309;">⚠️ 조심할 점</p>
    <div class="trait-tag-list" id="weaknessesList"></div>
  </div>

  <p class="section-title" style="margin-top:24px;">연애 스타일</p>
  <div class="card">
    <p style="margin:0;font-size:14px;line-height:1.8;color:var(--text-main);" id="loveStyleLabel"></p>
  </div>

  <p class="section-title" style="margin-top:24px;">일할 때 스타일</p>
  <div class="card">
    <p style="margin:0;font-size:14px;line-height:1.8;color:var(--text-main);" id="workStyleLabel"></p>
  </div>

  <p class="section-title" style="margin-top:28px;">나와 잘 맞는 혈액형은?</p>
  <div id="compatSection"></div>

  <div class="btn-row" style="margin-top:24px;">
    <button class="btn btn-primary" id="shareBtn" type="button">결과 공유하기</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="copyBtn" type="button">🔗 링크 복사</button>
  </div>

  <a class="btn btn-secondary" href="index.html" style="margin-top:20px;">🔄 다른 혈액형 보기</a>
  <a class="btn btn-secondary" href="../../index.html">🏠 다른 테스트 보러가기</a>

  <div class="ad-slot">광고 영역 (심사 통과 후 게재 예정)</div>

  <p class="notice">
    ⚠️ 이 콘텐츠는 재미로 즐기는 혈액형 성격설이며, 과학적으로 검증된 내용이 아니에요. 전문적인 심리 진단을 대신하지 않아요.
  </p>

  <div class="footer">
    <p><a href="../../privacy.html">개인정보처리방침</a> · <a href="../../terms.html">이용약관</a></p>
  </div>
</main>

<script src="../../assets/js/bloodtype-data.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var typeId = "a";
    var b = getBloodTypeById(typeId);
    var compat = getBloodTypeCompat(typeId);

    document.getElementById("oneLinerLabel").textContent = b.oneLiner;
    document.getElementById("descriptionLabel").textContent = b.description;
    document.getElementById("loveStyleLabel").textContent = b.loveStyle;
    document.getElementById("workStyleLabel").textContent = b.workStyle;

    var strengthsList = document.getElementById("strengthsList");
    b.strengths.forEach(function (s) {
      var span = document.createElement("span");
      span.className = "trait-tag good";
      span.textContent = s;
      strengthsList.appendChild(span);
    });

    var weaknessesList = document.getElementById("weaknessesList");
    b.weaknesses.forEach(function (w) {
      var span = document.createElement("span");
      span.className = "trait-tag caution";
      span.textContent = w;
      weaknessesList.appendChild(span);
    });

    renderCompatSection("compatSection", BLOOD_TYPE_LIST, compat);

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        "나는 " + b.name + " " + b.emoji + " " + b.oneLiner,
        "알아볼괘에서 내 혈액형 성격 궁합도 확인해봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyLinkToClipboard();
    });
  })();
</script>

</body>
</html>
