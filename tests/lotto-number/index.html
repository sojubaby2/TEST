<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>로또 번호 추천 | 테스트맛집</title>
<meta name="description" content="1부터 45까지 무작위로 뽑는 오늘의 행운 번호 6개. 버튼 한 번으로 계속 다시 뽑을 수 있어요." />

<meta property="og:type" content="website" />
<meta property="og:title" content="로또 번호 추천" />
<meta property="og:description" content="1~45 중 무작위로 뽑는 오늘의 행운 번호 6개, 마음에 들 때까지 계속 뽑아보세요!" />
<meta property="og:image" content="../../assets/img/og/lotto-number-intro.png" />
<meta property="og:url" content="./" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍀</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html">🔥 테스트맛집</a>
</header>

<main class="wrap">
  <section class="hero">
    <div style="font-size:56px;margin-bottom:8px;">🍀</div>
    <h1>로또 번호 추천</h1>
    <p>1부터 45까지, 무작위로 뽑는 오늘의 행운 번호<br />마음에 들 때까지 계속 뽑아보세요</p>
  </section>

  <div class="card" style="text-align:center;">
    <p class="lotto-draw-count" id="drawCount">아직 뽑지 않았어요</p>
    <div class="lotto-balls-row" id="ballsRow"></div>

    <button class="btn btn-primary" id="drawBtn" type="button" style="margin-top:14px;">🎲 번호 뽑기</button>
    <div class="btn-row" id="actionRow" style="display:none;margin-top:10px;">
      <button class="btn btn-secondary" id="shareBtn" type="button">결과 공유하기</button>
    </div>
    <div class="btn-row" id="actionRow2" style="display:none;">
      <button class="btn btn-secondary" id="downloadBtn" type="button">🖼️ 이미지 저장</button>
    </div>
  </div>

  <div class="card" id="historyCard" style="display:none;">
    <p class="section-title" style="margin-top:0;">이전에 뽑은 번호</p>
    <div class="lotto-history" id="historyList"></div>
  </div>

  <p class="notice">
    🍀 이 번호는 무작위로 생성된 참고용/재미용 번호이며, 실제 당첨을 보장하지 않아요. 복권 구매는 만 19세 이상만 가능하며, 과도한 구매는 지양해주세요.
  </p>

  <div class="ad-slot">광고 영역 (심사 통과 후 게재 예정)</div>

  <div class="footer">
    <p><a href="../../index.html">← 다른 테스트도 보러가기</a></p>
    <p><a href="../../privacy.html">개인정보처리방침</a> · <a href="../../terms.html">이용약관</a></p>
  </div>
</main>

<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var ballsRow = document.getElementById("ballsRow");
    var drawBtn = document.getElementById("drawBtn");
    var drawCount = document.getElementById("drawCount");
    var actionRow = document.getElementById("actionRow");
    var actionRow2 = document.getElementById("actionRow2");
    var shareBtn = document.getElementById("shareBtn");
    var downloadBtn = document.getElementById("downloadBtn");
    var historyCard = document.getElementById("historyCard");
    var historyList = document.getElementById("historyList");

    var history = [];
    var drawing = false;
    var latestNumbers = null;

    // 실제 로또 6/45 용지의 번호대별 공 색상 규칙(1~10 노랑, 11~20 파랑, 21~30 빨강, 31~40 회색, 41~45 초록)을 그대로 사용
    function ballColor(n) {
      if (n <= 10) return "#fbc400";
      if (n <= 20) return "#69c8f2";
      if (n <= 30) return "#ff7272";
      if (n <= 40) return "#aaaaaa";
      return "#b0d840";
    }

    function drawSixNumbers() {
      var pool = [];
      for (var i = 1; i <= 45; i++) pool.push(i);
      var picked = [];
      for (var k = 0; k < 6; k++) {
        var idx = Math.floor(Math.random() * pool.length);
        picked.push(pool[idx]);
        pool.splice(idx, 1);
      }
      picked.sort(function (a, b) { return a - b; });
      return picked;
    }

    function buildBallEl(size) {
      var el = document.createElement("div");
      el.className = size === "sm" ? "lotto-ball-sm" : "lotto-ball";
      return el;
    }

    function copyNumbersToClipboard(nums) {
      var text = nums.join(", ");
      function done() {
        showToast("번호가 복사됐어요! (" + text + ")");
      }
      function fallback() {
        var input = document.createElement("input");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand("copy");
          done();
        } catch (e) {
          showToast("복사에 실패했어요. 번호를 직접 선택해서 복사해주세요.");
        }
        document.body.removeChild(input);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else {
        fallback();
      }
    }

    function renderHistory() {
      if (history.length === 0) {
        historyCard.style.display = "none";
        return;
      }
      historyCard.style.display = "block";
      historyList.innerHTML = "";
      // 최신 뽑기가 위로 오도록 역순, 최대 8개까지만 보여줌(너무 길어지지 않게)
      var shown = history.slice(-8).reverse();
      shown.forEach(function (nums, i) {
        var row = document.createElement("div");
        row.className = "lotto-history-row";
        var label = document.createElement("span");
        label.className = "lotto-history-label";
        label.textContent = (history.length - i) + "번째";
        row.appendChild(label);
        var ballsWrap = document.createElement("div");
        ballsWrap.className = "lotto-history-balls";
        nums.forEach(function (n) {
          var b = buildBallEl("sm");
          b.style.background = ballColor(n);
          b.textContent = n;
          ballsWrap.appendChild(b);
        });
        row.appendChild(ballsWrap);
        var copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "lotto-copy-btn";
        copyBtn.textContent = "복사";
        copyBtn.addEventListener("click", function () {
          copyNumbersToClipboard(nums);
        });
        row.appendChild(copyBtn);
        historyList.appendChild(row);
      });
    }

    function runDraw() {
      if (drawing) return;
      drawing = true;
      drawBtn.disabled = true;
      drawCount.textContent = "번호를 뽑는 중이에요...";

      var finalNums = drawSixNumbers();
      ballsRow.innerHTML = "";
      var ballEls = [];
      for (var i = 0; i < 6; i++) {
        var el = buildBallEl();
        ballsRow.appendChild(el);
        ballEls.push(el);
      }

      var rollTimers = [];
      var settledCount = 0;

      ballEls.forEach(function (el, i) {
        el.classList.add("rolling");
        var rollTimer = setInterval(function () {
          var r = 1 + Math.floor(Math.random() * 45);
          el.textContent = r;
          el.style.background = ballColor(r);
        }, 45);
        rollTimers.push(rollTimer);

        setTimeout(function () {
          clearInterval(rollTimer);
          el.textContent = finalNums[i];
          el.style.background = ballColor(finalNums[i]);
          el.classList.remove("rolling");
          el.classList.add("settled");
          settledCount++;
          if (settledCount === 6) {
            finishDraw(finalNums);
          }
        }, 450 + i * 180);
      });
    }

    function finishDraw(finalNums) {
      drawing = false;
      drawBtn.disabled = false;
      drawBtn.textContent = "🔄 다른 번호 또 뽑기";
      history.push(finalNums);
      latestNumbers = finalNums;
      drawCount.textContent = "총 " + history.length + "번 뽑았어요";
      actionRow.style.display = "flex";
      actionRow2.style.display = "flex";
      renderHistory();
    }

    drawBtn.addEventListener("click", runDraw);

    shareBtn.addEventListener("click", function () {
      if (!latestNumbers) return;
      shareCurrentPage(
        "오늘의 행운 번호는 " + latestNumbers.join(", ") + " 이에요 🍀",
        "테스트맛집에서 나도 행운 번호 뽑아보기!"
      );
    });

    downloadBtn.addEventListener("click", function () {
      if (!latestNumbers) return;
      var canvas = document.createElement("canvas");
      var W = 640, H = 280;
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext("2d");

      var grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, "#7C3AED");
      grad.addColorStop(1, "#4C1D95");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🔥 테스트맛집 · 오늘의 행운 번호", W / 2, 54);

      var ballR = 34;
      var gap = 18;
      var totalW = 6 * (ballR * 2) + 5 * gap;
      var startX = (W - totalW) / 2 + ballR;
      var cy = 150;

      latestNumbers.forEach(function (n, i) {
        var cx = startX + i * (ballR * 2 + gap);
        ctx.beginPath();
        ctx.arc(cx, cy, ballR, 0, Math.PI * 2);
        ctx.fillStyle = ballColor(n);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(n), cx, cy + 2);
      });

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = "14px sans-serif";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("재미로 즐기는 참고용 번호예요 · testmatzip", W / 2, H - 20);

      var dataUrl = canvas.toDataURL("image/png");
      var a = document.createElement("a");
      a.href = dataUrl;
      a.download = "테스트맛집_행운번호_" + latestNumbers.join("-") + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  })();
</script>

</body>
</html>
