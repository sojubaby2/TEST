<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 36</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <div class="od-emo" id="qEmo"></div>
    <p class="question-text od-item" id="qText"></p>
    <p class="od-hint" id="qHint"></p>
    <div id="options" class="od-two"></div>
  </div>
</main>

<script src="../../assets/js/retro-age-data.js"></script>
<script>
  (function () {
    var Q = NT_DATA.questions, total = Q.length, current = 0, picks = [];
    var qNum = document.getElementById("qNum"), qEmo = document.getElementById("qEmo"), qText = document.getElementById("qText"), qHint = document.getElementById("qHint");
    var optionsEl = document.getElementById("options"), bar = document.getElementById("progressBar"), label = document.getElementById("progressLabel");
    function render() {
      var q = Q[current];
      qNum.textContent = "Q" + (current + 1);
      qEmo.textContent = q.emoji;
      qText.textContent = q.text;
      qHint.textContent = q.hint;
      optionsEl.innerHTML = "";
      [["🙆 해 봤다", 1], ["🙅 모른다", 0]].forEach(function (o) {
        var b = document.createElement("button");
        b.className = "option-btn"; b.type = "button"; b.textContent = o[0];
        b.addEventListener("click", function () { pick(o[1]); });
        optionsEl.appendChild(b);
      });
      bar.style.width = Math.round(current / total * 100) + "%";
      label.textContent = current + " / " + total;
    }
    function pick(k) {
      picks.push(k); current += 1;
      if (current >= total) {
        bar.style.width = "100%"; label.textContent = total + " / " + total;
        var url = finish(picks);
        setTimeout(function () { window.location.href = url; }, window.QP_DELAY || 350);
        return;
      }
      render(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function finish(p) {
      // 세대별(1~6단계) 아는 개수. 6개 중 4개 이상 해 본 가장 오래된 시대가 결과
      var c = [0, 0, 0, 0, 0, 0];
      p.forEach(function (v, i) { if (v === 1) c[Q[i].level - 1] += 1; });
      var lv = 1;
      for (var L = 6; L >= 2; L--) { if (c[L - 1] >= 4) { lv = L; break; } }
      return "result-" + NT_DATA.ids[lv - 1] + ".html?d=" + c.join("-");
    }
    render();
  })();
</script>

<script src="../../assets/js/quiz-plus.js"></script>
