<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IQ/EQ 테스트 진행중... | 알아볼괘</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 16</div>

  <div class="card">
    <div class="q-meta">
      <span class="question-num" id="qNum">Q1</span>
      <span class="q-tag" id="qTag"></span>
    </div>
    <p class="question-text" id="qText"></p>
    <div id="qFig"></div>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/iq-figures.js"></script>
<script src="../../assets/js/iqeq-data.js"></script>
<script>
  // 매번 새로 뽑습니다 (IQ 50문항 중 10문항 + EQ 6문항)
  var QUESTIONS = buildIqEqQuiz();
  var TOTAL = QUESTIONS.length;

  var current = 0;
  var iqScore = 0;
  var eqScore = 0;
  var locked = false;

  var qNum = document.getElementById("qNum");
  var qTag = document.getElementById("qTag");
  var qText = document.getElementById("qText");
  var qFig = document.getElementById("qFig");
  var optionsEl = document.getElementById("options");
  var progressBar = document.getElementById("progressBar");
  var progressLabel = document.getElementById("progressLabel");

  var DIFF_LABEL = { 1: "쉬움", 2: "보통", 3: "어려움", 4: "최고난도" };

  // 문항 글은 줄바꿈과 <b> 만 쓰므로 그대로 넣습니다
  function toHtml(s) {
    return String(s).replace(/\n/g, "<br />");
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    locked = false;

    qNum.textContent = "Q" + (current + 1);
    if (q.type === "iq") {
      qTag.textContent = CAT_LABEL[q.cat] + " · " + DIFF_LABEL[q.diff];
      qTag.className = "q-tag diff-" + q.diff;
    } else {
      qTag.textContent = "감성";
      qTag.className = "q-tag diff-eq";
    }

    qText.innerHTML = toHtml(q.text);

    // 문제 그림
    qFig.innerHTML = q.fig ? IQFigure.grid(q.fig.cells, q.fig.cols) : "";

    // 보기
    var isFigOpts = q.options.some(function (o) { return o.fig; });
    optionsEl.innerHTML = "";
    optionsEl.className = isFigOpts ? "opt-fig-grid" : "";

    q.options.forEach(function (opt, i) {
      var btn = document.createElement("button");
      btn.type = "button";

      if (opt.fig) {
        btn.className = "option-btn option-fig";
        btn.innerHTML = '<span class="opt-letter">' + "ABCD".charAt(i) + "</span>" +
                        IQFigure.cell(opt.fig, 78);
      } else {
        btn.className = "option-btn";
        btn.textContent = opt.text;
      }

      btn.addEventListener("click", function () { selectOption(q, opt); });
      optionsEl.appendChild(btn);
    });

    var pct = Math.round((current / TOTAL) * 100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = current + " / " + TOTAL;
  }

  function selectOption(q, opt) {
    if (locked) return;
    locked = true;

    if (q.type === "iq") { iqScore += opt.score; } else { eqScore += opt.score; }
    current += 1;

    if (current >= TOTAL) {
      progressBar.style.width = "100%";
      progressLabel.textContent = TOTAL + " / " + TOTAL;
      finishQuiz();
      return;
    }
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function finishQuiz() {
    var result = getIqEqResult(iqScore, eqScore);
    var url = "result-" + result.id + ".html?iq=" + iqScore + "&eq=" + eqScore;
    setTimeout(function () { window.location.href = url; }, 350);
  }

  renderQuestion();
</script>

</body>
</html>
