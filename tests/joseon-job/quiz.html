<body class="qp">

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>

<main class="wrap">
  <div class="progress-outer">
    <div class="progress-inner" id="progressBar" style="width:0%;"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 12</div>

  <div class="card">
    <div class="question-num" id="qNum">Q1</div>
    <p class="mg-scene" id="qScene"></p>
    <p class="question-text" id="qText"></p>
    <div id="options"></div>
  </div>
</main>

<script src="../../assets/js/joseon-job-data.js"></script>
<script>
  (function () {
    var Q = NT_DATA.questions, total = Q.length, current = 0, picks = [];
    var name = "";
    try { name = (localStorage.getItem("arabol:name") || "").trim(); } catch (e) {}
    var qNum = document.getElementById("qNum"), qScene = document.getElementById("qScene"), qText = document.getElementById("qText");
    var optionsEl = document.getElementById("options"), bar = document.getElementById("progressBar"), label = document.getElementById("progressLabel");
    function fill(t) { return t.replace("{이름}, ", name ? name + "님, " : "").replace("{이름}", name ? name + "님" : ""); }
    function render() {
      var q = Q[current];
      qNum.textContent = "Q" + (current + 1);
      qScene.textContent = q.scene || "";
      qText.textContent = fill(q.text);
      optionsEl.innerHTML = "";
      q.options.forEach(function (o) {
        var b = document.createElement("button");
        b.className = "option-btn"; b.type = "button"; b.textContent = o[0];
        b.addEventListener("click", function () { pick(o[1]); });
        optionsEl.appendChild(b);
      });
      bar.style.width = Math.round(current / total * 100) + "%";
      label.textContent = current + " / " + total;
    }
    function pick(k) {
      picks.push(k); current += 1;
      if (current >= total) {
        bar.style.width = "100%"; label.textContent = total + " / " + total;
        var url = finish(picks);
        setTimeout(function () { window.location.href = url; }, window.QP_DELAY || 350);
        return;
      }
      render(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function finish(p) {
      var t = {}; p.forEach(function (k) { t[k] = (t[k] || 0) + 1; });
      // 가장 많이 고른 유형. 동점이면 그중 가장 나중에 고른 답을 따름
      var max = 0; for (var k in t) if (t[k] > max) max = t[k];
      var best = null;
      for (var i = p.length - 1; i >= 0; i--) { if (t[p[i]] === max) { best = p[i]; break; } }
      var dist = NT_DATA.order.map(function (k) { return t[k] || 0; }).join("-");
      return "result-" + best + ".html?d=" + dist;
    }
    render();
  })();
</script>
