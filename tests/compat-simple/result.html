<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>우리 둘의 궁합은? | 알아볼괘 간단 궁합보기</title>
<meta name="description" content="이름과 생년월일로 확인한 우리 둘의 궁합 결과" />
<meta name="robots" content="noindex" />

<meta property="og:type" content="website" />
<meta property="og:title" content="우리 둘의 궁합은?" />
<meta property="og:description" content="이름 + 생년월일로 확인한 우리 궁합, 너도 확인해봐!" />
<meta property="og:image" content="../../assets/img/og/compat-simple-result.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💕</text></svg>" />
<link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a class="logo" href="../../index.html"><span class="logo-mark">☰</span> 알아볼괘</a>
</header>

<main class="wrap">
  <div id="errorBox" style="display:none;">
    <div class="card">
      <p style="margin:0;font-size:14px;" id="errorText"></p>
    </div>
    <a class="btn btn-primary" href="index.html" style="margin-top:16px;">다시 입력하기</a>
  </div>

  <div id="resultBox" style="display:none;">
    <div class="result-hero" id="resultHero">
      <div class="emoji" id="resultEmoji"></div>
      <h1 id="resultTitle"></h1>
      <p class="subtitle" id="resultSubtitle"></p>
    </div>

    <div class="card index-card">
      <p class="index-title">종합 궁합 점수</p>
      <p class="index-percent" id="indexPercent">-</p>
      <div class="index-gauge-outer">
        <div class="index-gauge-inner" id="indexGauge" style="width:0%;"></div>
      </div>
      <p class="index-sub" id="indexSub"></p>
    </div>

    <div class="card">
      <div class="dual-index-grid">
        <div class="index-mini">
          <p class="index-title">이름 궁합</p>
          <p class="index-percent-sm" id="nameScoreText"></p>
          <div class="index-gauge-outer">
            <div class="index-gauge-inner" id="nameScoreGauge" style="width:0%;"></div>
          </div>
        </div>
        <div class="index-divider"></div>
        <div class="index-mini">
          <p class="index-title">생년월일 궁합</p>
          <p class="index-percent-sm" id="dateScoreText"></p>
          <div class="index-gauge-outer">
            <div class="index-gauge-inner" id="dateScoreGauge" style="width:0%;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <p style="margin:0;font-size:15px;" id="gradeDesc"></p>
      <p class="section-title">이런 부분이 잘 맞아요</p>
      <ul class="trait-list" id="strengthsList"></ul>
      <p class="section-title">이런 부분은 신경 써보세요</p>
      <ul class="trait-list" id="cautionsList"></ul>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="shareBtn" type="button">결과 공유하기</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="copyBtn" type="button">🔗 링크 복사</button>
      <button class="btn btn-secondary" id="downloadBtn" type="button">🖼️ 이미지 저장</button>
    </div>

    <a class="btn btn-secondary" href="index.html" style="margin-top:20px;">🔄 다시 보기</a>
    <a class="btn btn-secondary" href="../../index.html">🏠 다른 테스트 보러가기</a>

    <div class="ad-slot">광고 영역 (심사 통과 후 게재 예정)</div>
  </div>

  <p class="notice">
    ⚠️ 이 결과는 재미로 즐기는 콘텐츠이며, 실제 역학이나 통계에 근거하지 않아요. 중요한 의사결정의 근거로 사용하지 마세요.
  </p>

  <div class="footer">
    <p><a href="../../privacy.html">개인정보처리방침</a> · <a href="../../terms.html">이용약관</a></p>
  </div>
</main>

<script src="../../assets/js/compat-simple-data.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var nameA = params.get("nameA");
    var dateA = params.get("dateA");
    var nameB = params.get("nameB");
    var dateB = params.get("dateB");

    var errorBox = document.getElementById("errorBox");
    var errorText = document.getElementById("errorText");
    var resultBox = document.getElementById("resultBox");

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    if (!nameA || !dateA || !nameB || !dateB) {
      showError("입력 정보를 찾을 수 없어요. 다시 입력해주세요.");
      return;
    }

    var result = getSimpleCompatResult(nameA, dateA, nameB, dateB);
    var grade = result.grade;

    resultBox.style.display = "block";

    document.getElementById("resultHero").style.background = grade.color;
    document.getElementById("resultEmoji").textContent = grade.emoji;
    document.getElementById("resultTitle").textContent = nameA + " ❤ " + nameB;
    document.getElementById("resultSubtitle").textContent = grade.title;

    var indexPercent = document.getElementById("indexPercent");
    var indexGauge = document.getElementById("indexGauge");
    indexPercent.textContent = result.overall + "%";
    indexPercent.style.color = grade.color;
    indexGauge.style.background = grade.color;
    requestAnimationFrame(function () {
      indexGauge.style.width = result.overall + "%";
    });
    document.getElementById("indexSub").textContent = grade.title + " 등급이에요";

    document.getElementById("nameScoreText").textContent = result.nameScore + "%";
    document.getElementById("dateScoreText").textContent = result.dateScore + "%";
    var nameGauge = document.getElementById("nameScoreGauge");
    var dateGauge = document.getElementById("dateScoreGauge");
    nameGauge.style.background = "#7C3AED";
    dateGauge.style.background = "#EC4899";
    requestAnimationFrame(function () {
      nameGauge.style.width = result.nameScore + "%";
      dateGauge.style.width = result.dateScore + "%";
    });

    document.getElementById("gradeDesc").textContent = grade.desc;

    var strengthsEl = document.getElementById("strengthsList");
    result.strengths.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      strengthsEl.appendChild(li);
    });
    var cautionsEl = document.getElementById("cautionsList");
    result.cautions.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      cautionsEl.appendChild(li);
    });

    document.getElementById("shareBtn").addEventListener("click", function () {
      shareCurrentPage(
        nameA + " ❤ " + nameB + " 궁합은 " + result.overall + "% (" + grade.title + ") " + grade.emoji,
        "우리 둘의 궁합, 너도 알아볼괘에서 확인해봐!"
      );
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyLinkToClipboard();
    });
    document.getElementById("downloadBtn").addEventListener("click", function () {
      downloadImage(
        "../../assets/img/card/compat-simple-" + grade.id + ".png",
        "알아볼괘_궁합_" + grade.title + ".png"
      );
    });
  })();
</script>

</body>
</html>
